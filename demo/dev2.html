<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>be-evanescent demo - infer from parent</title>
    <!-- #include virtual="/imports.html" -->

    <script type=module>
        import 'be-hive/be-hive.js';
    </script>
</head>
<body>
    <be-hive>
        <script type=emc src="be-evanescent/emc.json"></script>
    </be-hive>
    <my-component>
        <style be-evanescent>
            div{
                color: red;
            }
        </style>
        <div>hello</div>
    </my-component>
    <script>
        setTimeout(() => {
            customElements.define('my-component', class extends HTMLElement {} );
        }, 3000);
    </script>
</body>
</html>
