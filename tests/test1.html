<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- #include virtual="/imports.html" -->
    <be-hive>
        <script type=emc src="be-evanescent/emc.json"></script>
    </be-hive>
    <script type=module>
        import 'be-hive/be-hive.js';
    </script>
</head>
<body>
    <style class='test' be-evanescent='["be-evanescent"]'>
        div{
            color: red;
        }
    </style>
    <div>hello</div>
    <div id='target'></div>
    <script>
        function runScript(){
           if(document.querySelector('.test') === null){
               target.setAttribute('mark', 'good');
           }
        }
        setTimeout(() => {
           runScript();
       }, 4000);
   </script>
</body>
